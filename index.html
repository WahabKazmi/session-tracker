
<style>
.mk{--bg:#f5f5f0;--surf:#ffffff;--bord:#e8e8e3;--bord-em:#1a1a1a;--txt:#1a1a1a;--txt2:#6b7280;--txt3:#9ca3af;--act-bg:#1a1a1a;--act-fg:#ffffff;--act-sub:rgba(255,255,255,0.4);--prog:#f3f4f6;--sb-card:#f9f5eb;--sb-bord:#fcd34d;--sb-txt:#92400e;--sb-sub:#b45309;--sb-prog:rgba(245,158,11,0.2);font-family:Inter,system-ui,sans-serif;color:var(--txt)}
.mk.dk{--bg:#0f0f0f;--surf:#1c1c1e;--bord:#2c2c2e;--bord-em:#ffffff;--txt:#f2f2f7;--txt2:#8e8e93;--txt3:#636366;--act-bg:#ffffff;--act-fg:#1a1a1a;--act-sub:rgba(0,0,0,0.4);--prog:#2c2c2e;--sb-card:#27200a;--sb-bord:#92400e;--sb-txt:#fcd34d;--sb-sub:#fbbf24;--sb-prog:rgba(245,158,11,0.15)}
.mk{background:var(--bg);padding:1.5rem 1rem 3rem;min-height:100vh;transition:background .3s,color .3s}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:1rem 1.25rem;transition:background .3s,border-color .3s}
.lbl{font-size:11px;color:var(--txt3);letter-spacing:.07em;text-transform:uppercase;margin:0 0 5px}
.dim{color:var(--txt3)}
.srow{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:12px 14px;transition:all .25s}
.srow.act{background:var(--act-bg);border-color:var(--act-bg)}
.srow.act .snm{color:var(--act-fg)!important}
.srow.act .srng{color:var(--act-sub)!important}
.srow.nxt{border:1.5px solid var(--bord-em)}
.sb-inner{background:var(--sb-card);border:1px solid var(--sb-bord);border-radius:8px;padding:10px 12px;margin-top:8px;transition:background .3s,border-color .3s}
.sb-inner.sb-on{border-color:#f59e0b}
.tog{width:42px;height:24px;border-radius:12px;background:var(--bord);position:relative;cursor:pointer;transition:background .3s;border:none;padding:0;flex-shrink:0}
.tog.on{background:var(--bord-em)}
.thumb{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on .thumb{transform:translateX(18px)}
.mk.dk .thumb{background:#1a1a1a}
.prog-bar{height:100%;border-radius:99px;background:var(--act-bg);width:0%;transition:width 1s linear}
@keyframes pg{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.25)}50%{box-shadow:0 0 0 6px rgba(34,197,94,.08)}}
@keyframes pa{0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.3)}50%{box-shadow:0 0 0 6px rgba(245,158,11,.08)}}
.dot-g{background:#22c55e!important;animation:pg 2s ease-in-out infinite}
.dot-a{background:#f59e0b!important;animation:pa 2s ease-in-out infinite}
</style>

<div class="mk" id="mk">
<div style="max-width:420px;margin:0 auto">

  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.5rem">
    <div>
      <p class="lbl">ICT Sessions</p>
      <h1 style="font-size:22px;font-weight:500;color:var(--txt);margin:0">Market Clock</h1>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="text-align:right">
        <p class="lbl" style="margin-bottom:2px">Karachi</p>
        <p style="font-size:13px;font-weight:500;color:var(--txt2);margin:0" id="khi-time">--:-- --</p>
      </div>
      <div>
        <p class="lbl" style="text-align:center;margin-bottom:4px" id="theme-icon">☀️</p>
        <button class="tog" id="tog" onclick="toggleTheme()"><div class="thumb"></div></button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:10px">
    <p class="lbl">New York time</p>
    <p style="font-size:40px;font-weight:500;color:var(--txt);line-height:1;letter-spacing:-1px;margin:0" id="ny-time">--:-- --</p>
    <p style="font-size:13px;color:var(--txt3);margin:6px 0 0" id="ny-date">---</p>
  </div>

  <div class="card" style="margin-bottom:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pg 2s ease-in-out infinite"></div>
        <p class="lbl" style="margin:0">Now</p>
      </div>
      <span id="cur-pill" style="font-size:11px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--prog);color:var(--txt3)">Closed</span>
    </div>
    <p style="font-size:17px;font-weight:500;color:var(--txt);margin:0 0 2px" id="cur-name">Between sessions</p>
    <p style="font-size:13px;color:var(--txt3);margin:0 0 14px" id="cur-range">No session active</p>
    <div style="background:var(--prog);border-radius:99px;overflow:hidden;height:3px">
      <div class="prog-bar" id="prog-bar"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:6px">
      <span style="font-size:11px;color:var(--txt3)" id="prog-s">—</span>
      <span style="font-size:11px;font-weight:500;color:var(--txt2)" id="prog-p">Waiting</span>
      <span style="font-size:11px;color:var(--txt3)" id="prog-e">—</span>
    </div>
  </div>

  <div class="card" style="margin-bottom:1.5rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:7px;height:7px;border-radius:50%;background:#f59e0b"></div>
        <p class="lbl" style="margin:0">Up next</p>
      </div>
      <div style="text-align:right">
        <p style="font-size:10px;color:var(--txt3);margin:0 0 1px">starts in</p>
        <p style="font-size:13px;font-weight:500;color:#b45309;font-variant-numeric:tabular-nums;margin:0" id="nxt-cd">--:--</p>
      </div>
    </div>
    <p style="font-size:15px;font-weight:500;color:var(--txt);margin:0 0 2px" id="nxt-name">—</p>
    <p style="font-size:13px;color:var(--txt3);margin:0" id="nxt-range">—</p>
  </div>

  <p class="lbl" style="margin-bottom:10px">All sessions · NY time</p>
  <div style="display:flex;flex-direction:column;gap:6px" id="sess-list"></div>

</div>
</div>

<script>
const SESS=[
  {id:'lmid',  name:'London midnight',    s:'00:00',e:'02:00'},
  {id:'lkz',   name:'London kill zone',   s:'02:00',e:'05:00',sb:{s:'03:00',e:'04:00',lbl:'Silver Bullet · 3–4 AM'}},
  {id:'llunch',name:'London lunch',       s:'05:00',e:'07:00'},
  {id:'nykz',  name:'New York kill zone', s:'07:00',e:'10:00'},
  {id:'cme',   name:'CME open',           s:'08:20',e:'10:00'},
  {id:'lclose',name:'London close KZ',    s:'10:00',e:'12:00',sb:{s:'10:00',e:'11:00',lbl:'Silver Bullet · 10–11 AM'}},
  {id:'cbr',   name:'Central bank range', s:'14:00',e:'20:00',sb:{s:'14:00',e:'15:00',lbl:'Silver Bullet · 2–3 PM'}},
  {id:'asian', name:'Asian range',        s:'20:00',e:'22:00'},
];
const tm=h=>{const[a,b]=h.split(':').map(Number);return a*60+b};
const f12=h=>{const[a,b]=h.split(':').map(Number),ap=a<12?'AM':'PM',h2=a%12||12;return`${h2}:${String(b).padStart(2,'0')} ${ap}`};
const fck=(d,z)=>d.toLocaleTimeString('en-US',{timeZone:z,hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
const fdt=(d,z)=>d.toLocaleDateString('en-US',{timeZone:z,weekday:'long',month:'short',day:'numeric'});
const fcd=m=>{const h=Math.floor(Math.abs(m)/60),mn=Math.floor(Math.abs(m)%60);return h>0?`${h}h ${String(mn).padStart(2,'0')}m`:`${mn}m`};
function nym(d){const s=d.toLocaleString('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const t=s.includes(', ')?s.split(', ').pop():s;const[h,m,sc]=t.split(':').map(Number);return h*60+m+sc/60}

const list=document.getElementById('sess-list');
SESS.forEach(s=>{
  const w=document.createElement('div');
  w.innerHTML=`<div id="row-${s.id}" class="srow">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:8px">
        <div id="dot-${s.id}" style="width:7px;height:7px;border-radius:50%;background:var(--txt3);flex-shrink:0;transition:all .3s"></div>
        <span class="snm" id="nm-${s.id}" style="font-size:13px;font-weight:500;color:var(--txt)">${s.name}</span>
      </div>
      <span class="srng dim" id="rng-${s.id}" style="font-size:12px;font-variant-numeric:tabular-nums">${f12(s.s)} – ${f12(s.e)}</span>
    </div>
    ${s.sb?`<div id="sb-${s.id}" class="sb-inner">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px">
          <div id="sbd-${s.id}" style="width:6px;height:6px;border-radius:50%;background:#f59e0b;opacity:.45;flex-shrink:0;transition:all .3s"></div>
          <span style="font-size:12px;font-weight:500;color:var(--sb-txt)">${s.sb.lbl}</span>
        </div>
        <span id="sbpill-${s.id}" style="font-size:11px;font-weight:500;padding:2px 8px;border-radius:99px;background:rgba(245,158,11,.15);color:var(--sb-sub)">waiting</span>
      </div>
      <div style="background:var(--sb-prog);border-radius:99px;overflow:hidden;height:3px;margin-bottom:6px">
        <div id="sbbar-${s.id}" style="height:100%;border-radius:99px;background:#f59e0b;width:0%;transition:width 1s linear"></div>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:11px;color:var(--sb-sub)">${f12(s.sb.s)}</span>
        <span id="sbpct-${s.id}" style="font-size:11px;font-weight:500;color:var(--sb-txt)">—</span>
        <span style="font-size:11px;color:var(--sb-sub)">${f12(s.sb.e)}</span>
      </div>
    </div>`:''}
  </div>`;
  list.appendChild(w);
});

let dark=window.matchMedia('(prefers-color-scheme: dark)').matches;
const saved=localStorage.getItem('mck5');
if(saved!==null) dark=saved==='1';
function applyTheme(){
  const mk=document.getElementById('mk');
  const tog=document.getElementById('tog');
  const icon=document.getElementById('theme-icon');
  if(dark){mk.classList.add('dk');tog.classList.add('on');icon.textContent='🌙';}
  else{mk.classList.remove('dk');tog.classList.remove('on');icon.textContent='☀️';}
  localStorage.setItem('mck5',dark?'1':'0');
}
function toggleTheme(){dark=!dark;applyTheme();}
applyTheme();

function tick(){
  const now=new Date();
  document.getElementById('ny-time').textContent=fck(now,'America/New_York');
  document.getElementById('ny-date').textContent=fdt(now,'America/New_York');
  document.getElementById('khi-time').textContent=fck(now,'Asia/Karachi');
  const ny=nym(now);
  let act=null,nxt=null,mg=Infinity;
  SESS.forEach(s=>{
    const st=tm(s.s),en=tm(s.e);
    if(ny>=st&&ny<en)act={s,el:ny-st,tot:en-st,lft:en-ny};
    let g=st-ny;if(g<=0)g+=1440;if(g<mg){mg=g;nxt={s,g};}
  });

  SESS.forEach(s=>{
    document.getElementById('row-'+s.id).className='srow';
    const dot=document.getElementById('dot-'+s.id);
    dot.style.background='var(--txt3)';dot.style.animation='';dot.style.boxShadow='';
    document.getElementById('nm-'+s.id).style.color='var(--txt)';
    document.getElementById('rng-'+s.id).style.color='var(--txt3)';
    if(s.sb){
      const sst=tm(s.sb.s),sen=tm(s.sb.e),on=ny>=sst&&ny<sen;
      document.getElementById('sb-'+s.id).className='sb-inner'+(on?' sb-on':'');
      const sbd=document.getElementById('sbd-'+s.id);
      const sbpill=document.getElementById('sbpill-'+s.id);
      const sbbar=document.getElementById('sbbar-'+s.id);
      const sbpct=document.getElementById('sbpct-'+s.id);
      if(on){
        sbd.style.opacity='1';sbd.style.animation='pa 2s ease-in-out infinite';
        sbpill.textContent='active';sbpill.style.background='rgba(245,158,11,.3)';
        const pct=Math.round(((ny-sst)/(sen-sst))*100);
        sbbar.style.width=pct+'%';
        sbpct.textContent=`${pct}% · ${fcd(sen-ny)} left`;
      } else {
        sbd.style.opacity='.45';sbd.style.animation='';
        sbpill.textContent='waiting';sbpill.style.background='rgba(245,158,11,.15)';
        sbbar.style.width='0%';
        let sg=sst-ny;if(sg<=0)sg+=1440;
        sbpct.textContent=`in ${fcd(sg)}`;
      }
    }
  });

  const pill=document.getElementById('cur-pill');
  if(act){
    const s=act.s;
    document.getElementById('cur-name').textContent=s.name;
    document.getElementById('cur-range').textContent=`${f12(s.s)} – ${f12(s.e)} NY`;
    pill.textContent='Active';pill.style.background='#dcfce7';pill.style.color='#166534';
    const pct=Math.round((act.el/act.tot)*100);
    document.getElementById('prog-bar').style.width=pct+'%';
    document.getElementById('prog-s').textContent=f12(s.s);
    document.getElementById('prog-p').textContent=`${pct}% · ${fcd(act.lft)} left`;
    document.getElementById('prog-e').textContent=f12(s.e);
    document.getElementById('row-'+s.id).className='srow act';
    const dot=document.getElementById('dot-'+s.id);
    dot.style.background='#22c55e';dot.style.animation='pg 2s ease-in-out infinite';
    document.getElementById('nm-'+s.id).style.color='var(--act-fg)';
    document.getElementById('rng-'+s.id).style.color='var(--act-sub)';
  } else {
    document.getElementById('cur-name').textContent='Between sessions';
    document.getElementById('cur-range').textContent='No session active';
    pill.textContent='Closed';pill.style.background='var(--prog)';pill.style.color='var(--txt3)';
    document.getElementById('prog-bar').style.width='0%';
    document.getElementById('prog-s').textContent='—';
    document.getElementById('prog-p').textContent='Waiting';
    document.getElementById('prog-e').textContent='—';
  }
  if(nxt){
    const s=nxt.s;
    document.getElementById('nxt-name').textContent=s.name;
    document.getElementById('nxt-range').textContent=`${f12(s.s)} – ${f12(s.e)} NY`;
    document.getElementById('nxt-cd').textContent=fcd(nxt.g);
    if(!act||act.s.id!==s.id){
      document.getElementById('row-'+s.id).className='srow nxt';
      const dot=document.getElementById('dot-'+s.id);
      dot.style.background='#f59e0b';dot.style.animation='';
    }
  }
}
tick();setInterval(tick,1000);
</script>
